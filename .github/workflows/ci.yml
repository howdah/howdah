name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'   # weekly full matrix

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: host tests, clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --locked -p howdah-core
      - run: cargo test --locked -p howdah-ext
      - run: cargo clippy --locked -p howdah-core -p howdah-ext --all-targets -- -D warnings
      # cargo fmt --check is intentionally not run yet: the tree has not been
      # rustfmt-formatted and there is no rustfmt.toml.

  fuzz-smoke:
    name: fuzz smoke (multipart)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Run the multipart target briefly
        working-directory: fuzz
        run: cargo fuzz run multipart -- -runs=20000 -max_total_time=60
      - name: Run the events target briefly (the interface the PHP glue uses)
        working-directory: fuzz
        run: cargo fuzz run events -- -runs=20000 -max_total_time=60

  # Per-PR arm64 build smoke on the native arm64 runner (ubuntu-24.04-arm; QEMU
  # not used). Spans generations incl. PHP 5.x, the key open question for
  # aarch64; 5.4 is included because its 2008 config.guess needs the explicit
  # --build triple build-one.sh passes. Non-blocking: it reports whether each
  # minor builds and does not gate merges. build-one.sh asserts ELF/glibc <= 2.17
  # itself; re-checked here.
  aarch64-build-smoke:
    name: aarch64 build PHP ${{ matrix.minor }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        minor: ['5.4', '5.6', '7.4', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Build aarch64 tarball
        run: HOWDAH_ARCH=aarch64 packaging/build-release.sh "${{ matrix.minor }}"
      - name: Assert ARM aarch64 ELF with glibc <= 2.17
        run: |
          tmp="$(mktemp -d)"
          tar -xzf packaging/out/*-linux-aarch64.tar.gz -C "$tmp"
          so="$(ls "$tmp"/*/howdah.so)"
          file "$so" | tee /dev/stderr | grep -q 'ELF 64-bit.*ARM aarch64'
          max="$(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)"
          echo "glibc max ref: $max"
          [ "$(printf '%s\n2.17\n' "$max" | sort -V | tail -1)" = 2.17 ]

  # Per-PR musl (Alpine) build smoke: the HOWDAH_LIBC=musl release path for one
  # minor, then the .so must load in the official Alpine image of that minor.
  # Non-blocking, like the aarch64 smoke: the release's musl cells are
  # best-effort too.
  musl-build-smoke:
    name: musl build PHP 8.3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build the musl tarball
        run: HOWDAH_LIBC=musl packaging/build-release.sh 8.3
      - name: Load it in php:8.3-fpm-alpine
        run: |
          docker run --rm -i php:8.3-fpm-alpine sh -ec '
            tar -xzf - -C /tmp
            php -d extension="$(ls /tmp/*/howdah.so)" -m | grep -qx howdah
            php -d extension="$(ls /tmp/*/howdah.so)" --ri howdah | grep "^Version"
          ' < "$(ls packaging/out/*-linux-x86_64-musl.tar.gz)"

  # Runtime image (docker/Dockerfile) from a fixed published release, smoke
  # tested the way docker.yml gates a push. Pinned to 1.4.0 so the result does
  # not change under the PR; FPM_BLOCK=bailout pins that release's php-fpm
  # refusal behaviour (see docker/smoke.sh).
  docker-image:
    name: docker image (1.4.0, PHP 8.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sh docker/matrix.test.sh
      - run: sh docker/fetch.test.sh 1.4.0
      - name: Build and smoke-test the PHP 8.3 image
        run: |
          docker buildx build --load -f docker/Dockerfile \
            --build-arg HOWDAH_VERSION=1.4.0 --build-arg PHP_MINOR=8.3 -t howdah-ci:php8.3 .
          FPM_BLOCK=bailout sh docker/smoke.sh howdah-ci:php8.3

  wasm:
    name: wasm build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --locked -p howdah-wasm
      - run: cargo build --locked -p howdah-wasm --target wasm32-unknown-unknown --release
      - name: Demo samples give the expected verdicts on the built wasm
        run: |
          cp target/wasm32-unknown-unknown/release/howdah_wasm.wasm site/demo/howdah_wasm.wasm
          node site/demo/verify.js
      # The site's tests pin the config editor's schema to the core's defaults
      # and rule catalog, so a core change that drifts fails here, on the PR.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site

  lab:
    name: lab PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # PRs and pushes run the reduced set (reduced: true); tags and the weekly
    # schedule run every entry.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '5.6', feature: php5, reduced: true }
          - { php: '7.3', feature: php7, reduced: true }
          - { php: '8.4', feature: php8, reduced: true }
          - { php: '5.4', feature: php5, reduced: false }
          - { php: '7.4', feature: php7, reduced: false }
          - { php: '8.1', feature: php8, reduced: false }
    env:
      IMAGE: howdah-dev-php${{ matrix.php }}
      BASE: lab-php-${{ matrix.php }}
      FEATURE: ${{ matrix.feature }}
      RUN_IT: ${{ matrix.reduced || startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_IT == 'true'
      - name: Build lab base image
        if: env.RUN_IT == 'true'
        run: docker build -f lab/images/php-${{ matrix.php }}.Dockerfile -t "$BASE" lab/images
      - name: Shaped upload is blocked
        if: env.RUN_IT == 'true'
        run: lab/integration/block_shaped.sh
      - name: Self-test flags the server
        if: env.RUN_IT == 'true'
        run: lab/integration/selftest.sh
      - name: Panic guard is active in the release build (panic=unwind)
        if: env.RUN_IT == 'true'
        run: |
          docker run --rm -v "$PWD":/src:ro "$IMAGE" sh -ec '
            export CARGO_TARGET_DIR=/tmp/t
            cd /src
            cargo build --locked -p howdah-ext --features "'"$FEATURE"'" --release 2>&1 | tail -3
            out=$(php -d extension=/tmp/t/release/libhowdah_ext.so --ri howdah)
            echo "$out"
            echo "$out" | grep -E "Panic guard.*=> yes" || { echo "panic guard NOT active (panic=abort regression?)"; exit 1; }
          '

  # The lab scenarios on native arm64 (ubuntu-24.04-arm, the runner the
  # aarch64 build smoke already uses). The lab images for 7.4 (bullseye) and
  # 8.3 (trixie) build from multi-arch php:*-fpm bases with the distro clang,
  # so nothing in them is amd64-only. Non-blocking while it earns a record;
  # docs/coverage.md says what it does and does not cover.
  lab-aarch64:
    name: lab aarch64 PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', feature: php7 }
          - { php: '8.3', feature: php8 }
    env:
      IMAGE: howdah-dev-php${{ matrix.php }}
      BASE: lab-php-${{ matrix.php }}
      FEATURE: ${{ matrix.feature }}
    steps:
      - uses: actions/checkout@v4
      - name: Build lab base image
        run: docker build -f lab/images/php-${{ matrix.php }}.Dockerfile -t "$BASE" lab/images
      - name: Runs on aarch64
        run: docker run --rm "$BASE" uname -m | tee /dev/stderr | grep -qx aarch64
      - name: Shaped upload is blocked
        run: lab/integration/block_shaped.sh
      - name: Self-test flags the server
        run: lab/integration/selftest.sh

  shell:
    name: howdah-check + package layout tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # detect's layout/package lines must match packaging/layouts.tsv, and every
      # row must render a valid spec/control (no docker needed)
      - run: sh tools/howdah-check.test.sh
      - run: sh packaging/layouts.test.sh
      # reproducible-build helpers (deterministic tar, SOURCE_DATE_EPOCH,
      # Installed-Size) and the package attestation subject list
      - run: sh packaging/reproducible.test.sh
      - run: sh packaging/repo/attest-subjects.test.sh

  # Dependency hygiene on every PR. cargo deny (RustSec advisories, licences,
  # bans and sources for the Rust workspace; policy in deny.toml) is a hard
  # check: it passes today, and a new finding turns the job red. npm audit of
  # the site's production dependencies (the Astro site and the cfg.howdah.org
  # worker share site/package-lock.json) is reported, not gating: its findings
  # go to the job summary and a ::warning:: annotation, and the step's
  # continue-on-error keeps the job green. Fix those in their own change.
  deps:
    name: dependency checks (cargo deny, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny (pinned release, sha256-verified)
        run: |
          set -euo pipefail
          v=0.20.2
          cd "$(mktemp -d)"
          curl -fsSLO "https://github.com/EmbarkStudios/cargo-deny/releases/download/$v/cargo-deny-$v-x86_64-unknown-linux-musl.tar.gz"
          # sha256 from the release's cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz.sha256
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny-$v-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
          tar -xzf "cargo-deny-$v-x86_64-unknown-linux-musl.tar.gz"
          sudo install -m 0755 "cargo-deny-$v-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/cargo-deny
          cargo-deny --version
      - name: cargo deny check (advisories, licenses, bans, sources)
        run: cargo-deny --color always check
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
      # Reported, not gating (see above). scripts/audit-summary.mjs writes the
      # counts by severity and every advisory to the job summary and emits one
      # ::warning:: annotation; it exits 0 on findings and 2 only when npm
      # audit gave no report, and continue-on-error keeps even that from
      # failing the job.
      - name: npm audit (site and worker, production dependencies; not gating)
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: site
        run: npm audit --omit=dev --json | node scripts/audit-summary.mjs

  # Latency regression gate (lab/bench/README.md). Short mode: PHP 8.3,
  # php-fpm behind nginx, every configuration x workload, one 10 s round per
  # cell. Fails if Howdah adds more than 50 us to the median GET with no body,
  # or if any cell's p50 relative to the same run's no-extension cell grows
  # more than 25% over lab/bench/baseline-ci.json. GitHub-hosted runners are
  # shared VMs with noisy timings, so both limits are deliberately loose: this
  # catches a gross regression, not a small one. No other job depends on it.
  bench:
    name: bench (latency gate, PHP 8.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bench reporter unit tests
        run: node --test lab/bench/bench.test.mjs
      - name: Build lab base image
        run: docker build -f lab/images/php-8.3.Dockerfile -t lab-php-8.3 lab/images
      - name: Latency harness (short mode)
        run: MODE=ci OUT="$PWD/lab/bench/out/ci" sh lab/bench/run.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: lab/bench/out/ci/
          if-no-files-found: warn
      - name: Regression gate
        run: node lab/bench/bench.mjs gate lab/bench/out/ci/results.json lab/bench/baseline-ci.json
