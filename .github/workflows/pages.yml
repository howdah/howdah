name: pages

# Builds the Astro site in site/ and deploys it to GitHub Pages (howdah.org).
# Triggers on push to main, so the site goes live when 0.1 merges.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The demo and the config editor run the real core as wasm. It is built
      # here from this commit (never committed), so the site can't ship a
      # stale validator.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pages-wasm-${{ hashFiles('Cargo.lock') }}
      - name: Build the core as wasm
        run: sh packaging/build-wasm.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
      # Scripts, styles, images, frames, forms and fetches must be first-party.
      # Hyperlinks to sources are fine. Same check as site/test/external.test.mjs.
      - name: No third-party requests in the build
        run: node scripts/check-external.mjs dist
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
