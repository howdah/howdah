name: publish-repos

# MANUAL publish of the signed apt + yum repositories to pkg.howdah.org
# (Cloudflare R2). Run it deliberately from the Actions tab:
#   Actions -> publish-repos -> Run workflow.
# See packaging/repo/GO-LIVE.md for the owner checklist (secrets, key.asc,
# Cloudflare cache rules, post-publish verification).
#
# Safety rails:
#   * workflow_dispatch only; nothing runs on push/tag.
#   * `publish` defaults to false: the run builds, signs, assembles and
#     dry-runs the upload but writes NOTHING to R2 until you tick it.
#   * Upload is rclone `copy` (never `sync`), in dependency order, with
#     --immutable on packages: superseded packages are never deleted.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Howdah version to package (e.g. 1.0.0). Empty = Cargo.toml version."
        required: false
        default: ""
      publish:
        description: "Actually upload to R2 (false = build + sign + dry-run only)"
        type: boolean
        default: false
      overwrite:
        description: "Allow overwriting already-published package files (same-version re-publish, e.g. arch backfill). Purge the Cloudflare pool cache after."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ---- .deb + .rpm per PHP minor, x86_64 (gating) --------------------------
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minor: ["5.4", "5.5", "5.6", "7.0", "7.1", "7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Build glibc-2.17 tarball, .deb (amd64) and .rpm (x86_64) for PHP ${{ matrix.minor }}
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then export HOWDAH_VERSION="$INPUT_VERSION"; fi
          # build-deb.sh / build-rpm.sh build the release tarball themselves
          # (packaging/build-release.sh) when it is absent from packaging/out.
          packaging/deb/build-deb.sh "${{ matrix.minor }}" amd64
          packaging/rpm/build-rpm.sh "${{ matrix.minor }}" x86_64
          ls -l packaging/out

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: pkgs-php${{ matrix.minor }}-x86_64
          path: |
            packaging/out/*.deb
            packaging/out/*.rpm
          if-no-files-found: error

      # Panel / stock-EL layout packages (packaging/layouts.tsv) from the SAME
      # tarball. Best-effort: they go to their own repositories and must never
      # block the main apt/yum publish, so a failure here only drops them.
      - name: Build layout packages (cPanel, Plesk, CloudLinux, stock EL) for PHP ${{ matrix.minor }}
        continue-on-error: true
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then export HOWDAH_VERSION="$INPUT_VERSION"; fi
          HOWDAH_NO_BUILD=1 packaging/build-layouts.sh "${{ matrix.minor }}" x86_64

      - name: Upload layout packages
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: layouts-php${{ matrix.minor }}-x86_64
          path: packaging/out/layouts/
          if-no-files-found: warn

  # ---- arm64/aarch64 packages: BEST-EFFORT, never blocks the publish -------
  # Same policy as release.yml: native arm64 runner; a failed cell just means
  # no arm64/aarch64 package for that minor.
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        minor: ["5.4", "5.5", "5.6", "7.0", "7.1", "7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Build glibc-2.17 tarball, .deb (arm64) and .rpm (aarch64) for PHP ${{ matrix.minor }}
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then export HOWDAH_VERSION="$INPUT_VERSION"; fi
          packaging/deb/build-deb.sh "${{ matrix.minor }}" arm64
          packaging/rpm/build-rpm.sh "${{ matrix.minor }}" aarch64
          ls -l packaging/out

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: pkgs-php${{ matrix.minor }}-aarch64
          path: |
            packaging/out/*.deb
            packaging/out/*.rpm
          if-no-files-found: error

      - name: Build layout packages (rows that list aarch64) for PHP ${{ matrix.minor }}
        continue-on-error: true
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then export HOWDAH_VERSION="$INPUT_VERSION"; fi
          HOWDAH_NO_BUILD=1 packaging/build-layouts.sh "${{ matrix.minor }}" aarch64

      - name: Upload layout packages
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: layouts-php${{ matrix.minor }}-aarch64
          path: packaging/out/layouts/
          if-no-files-found: warn

  # ---- sign + assemble both repos, then (optionally) upload to R2 ----------
  publish:
    needs: [build, build-aarch64]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pkg-publish
    permissions:
      contents: read
      id-token: write       # OIDC token for the attestations' Sigstore certificate
      attestations: write   # build provenance for the packages (publish runs only)
    steps:
      - uses: actions/checkout@v4

      # Only the main-repo artifacts (pkgs-*). The layout packages (layouts-*)
      # must never reach packaging/out/*.deb|*.rpm, the main repo's inputs.
      - name: Collect all packages
        uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: pkgs-*
          merge-multiple: true

      - name: Gather packages into packaging/out
        run: |
          mkdir -p packaging/out
          find dl \( -name '*.deb' -o -name '*.rpm' \) -exec cp {} packaging/out/ \;
          ls -l packaging/out

      # Same import as release.yml: the passphraseless RSA signing SUBKEY,
      # loopback pinentry, never the offline primary key.
      - name: Import CI signing subkey (passphraseless, non-interactive)
        env:
          HOWDAH_GPG_SIGNING_KEY: ${{ secrets.HOWDAH_GPG_SIGNING_KEY }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          printf '%s\n' "$HOWDAH_GPG_SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Install rclone
        run: |
          set -euo pipefail
          v=v1.75.2
          cd "$(mktemp -d)"
          curl -fsSLO "https://downloads.rclone.org/$v/rclone-$v-linux-amd64.zip"
          # sha256 of rclone-v1.75.2-linux-amd64.zip (from downloads.rclone.org/v1.75.2/SHA256SUMS)
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  rclone-$v-linux-amd64.zip" | sha256sum -c -
          unzip -q "rclone-$v-linux-amd64.zip"
          sudo install -m 0755 "rclone-$v-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1

      # Seed the build from the EXISTING published pool so the regenerated index
      # keeps every prior version (apt-ftparchive / createrepo_c index the union
      # of seed + new). On the FIRST publish these paths do not exist yet (empty
      # seed) and that is fine; on any LATER publish an empty seed means the
      # download failed, so we abort rather than regenerate an index that silently
      # drops every prior version. The `R2:` remote is the same env-var remote the
      # upload step uses.
      - name: Seed the pool from R2 (keep prior versions in the index)
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.HOWDAH_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.HOWDAH_R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.HOWDAH_R2_ENDPOINT }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          HOWDAH_R2_BUCKET: ${{ secrets.HOWDAH_R2_BUCKET }}
        run: |
          SEED="${{ github.workspace }}/.repo-seed"
          rm -rf "$SEED"; mkdir -p "$SEED/apt/pool" "$SEED/yum"
          echo "SEED=$SEED" >> "$GITHUB_ENV"

          # 1. Probe what R2 ALREADY holds (before downloading). `lsf` lists object
          #    paths; an absent/empty prefix prints nothing and must not fail the
          #    step (hence `|| true`). Non-empty => a prior publish exists.
          REMOTE_DEB="$(rclone lsf "R2:$HOWDAH_R2_BUCKET/apt/pool" -R --files-only --include '*.deb' 2>/dev/null | head -1 || true)"
          REMOTE_RPM="$(rclone lsf "R2:$HOWDAH_R2_BUCKET/yum"      -R --files-only --include '*.rpm' 2>/dev/null | head -1 || true)"
          echo "== remote has apt debs: $([ -n "$REMOTE_DEB" ] && echo yes || echo no); yum rpms: $([ -n "$REMOTE_RPM" ] && echo yes || echo no)"

          # 2. Download the seed. A genuinely-absent prefix can make rclone exit
          #    non-zero, so stay tolerant here; the assert in step 3 is what turns
          #    a FAILED (vs legitimately-empty) download into a hard error.
          rclone copy "R2:$HOWDAH_R2_BUCKET/apt/pool" "$SEED/apt/pool" -v --retries 5 --low-level-retries 10 || true
          rclone copy "R2:$HOWDAH_R2_BUCKET/yum" "$SEED/yum" --include '*.rpm' -v --retries 5 --low-level-retries 10 || true

          LOCAL_DEB="$(find "$SEED/apt/pool" -name '*.deb' 2>/dev/null | head -1 || true)"
          LOCAL_RPM="$(find "$SEED/yum" -name '*.rpm' 2>/dev/null | head -1 || true)"
          echo "== seeded apt pool:"; find "$SEED/apt/pool" -name '*.deb' | sort | sed 's/^/  /' || true
          echo "== seeded yum rpms:"; find "$SEED/yum" -name '*.rpm' | sort | sed 's/^/  /' || true

          # 3. Consistency assert: if R2 already has a published pool but our local
          #    seed came back empty, the download failed — abort, because building
          #    now would regenerate an index that drops every prior version while
          #    the publish still "succeeds" (the exact silent regression this
          #    feature exists to prevent). First publish (remote empty) skips this.
          if [ -n "$REMOTE_DEB" ] && [ -z "$LOCAL_DEB" ]; then
            echo "::error::R2 already has an apt pool but the local seed is empty — the seed download failed; aborting so we do not publish an index that drops prior versions."
            exit 1
          fi
          if [ -n "$REMOTE_RPM" ] && [ -z "$LOCAL_RPM" ]; then
            echo "::error::R2 already has yum rpms but the local seed is empty — the seed download failed; aborting so we do not publish an index that drops prior versions."
            exit 1
          fi

      - name: Assemble + sign the apt repo (apt-ftparchive, seeded)
        env:
          # Pin the exact signing subkey, same value release.yml's sign.sh uses.
          HOWDAH_GPG_KEYID: "9A104FB0A073065B2C2631FC1E8D725D31BD5DC9!"
          HOWDAH_GNUPGHOME: ${{ github.workspace }}/.gnupg-home
          HOWDAH_APT_SEED: ${{ env.SEED }}/apt/pool
        run: |
          rm -rf "$HOWDAH_GNUPGHOME"; cp -a "$HOME/.gnupg" "$HOWDAH_GNUPGHOME"
          packaging/repo/build-apt-repo.sh

      - name: Assemble + sign the yum repo (createrepo_c, rpmsign; seeded)
        env:
          HOWDAH_GPG_KEYID: "9A104FB0A073065B2C2631FC1E8D725D31BD5DC9!"
          HOWDAH_GNUPGHOME: ${{ github.workspace }}/.gnupg-home
          HOWDAH_YUM_SEED: ${{ env.SEED }}/yum
        run: packaging/repo/build-yum-repo.sh

      - name: Verify the signatures against the COMMITTED public key (clean keyring)
        run: |
          tmp="$(mktemp -d)"
          export GNUPGHOME="$tmp"
          gpg --batch --import packaging/howdah-release-signing.asc
          r=packaging/out/repo
          gpg --batch --verify "$r/apt/dists/stable/InRelease"
          gpg --batch --verify "$r/apt/dists/stable/Release.gpg" "$r/apt/dists/stable/Release"
          gpg --batch --verify "$r/yum/repodata/repomd.xml.asc" "$r/yum/repodata/repomd.xml"
          find "$r" -type f | sort | head -100
          rm -rf "$tmp"

      # SLSA build provenance for the packages THIS run built (not the ones
      # seeded from R2), as users download them: each .deb from the pool, each
      # .rpm after rpmsign. Real publishes only; a dry run attests nothing.
      # Verify: gh attestation verify <pkg> -R howdah/howdah  (docs/verify.md)
      - name: List the new apt + yum packages (attestation subjects)
        if: ${{ inputs.publish }}
        run: |
          packaging/repo/attest-subjects.sh packaging/out packaging/out/repo > packaging/out/attest-repo.sha256
          cat packaging/out/attest-repo.sha256

      - name: Attest build provenance (apt + yum packages)
        if: ${{ inputs.publish }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: packaging/out/attest-repo.sha256

      # Owner-set repo secrets (NOT created by this change; see GO-LIVE.md):
      #   HOWDAH_R2_ACCESS_KEY_ID, HOWDAH_R2_SECRET_ACCESS_KEY,
      #   HOWDAH_R2_ENDPOINT (https://<acct>.r2.cloudflarestorage.com),
      #   HOWDAH_R2_BUCKET.
      # They are mapped to rclone's env-var remote named `R2`.
      #
      # Upload order is enforced by packaging/repo/publish-r2.sh:
      #   packages (pool/, *.rpm)  ->  Packages*/repodata  ->  Release/Release.gpg/
      #   InRelease + repomd.xml/.asc LAST. Copy only, no deletes.
      #
      # Cloudflare cache expectations (rules live in the dashboard; see GO-LIVE.md).
      # The script also stamps Cache-Control on each object so origin headers agree:
      #   pool/** and *.rpm      long (1y, immutable)  - version-named
      #   dists/** and repodata/**  short (5 min)      - mutable indexes
      - name: Upload to R2 (dependency order)
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.HOWDAH_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.HOWDAH_R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.HOWDAH_R2_ENDPOINT }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          HOWDAH_R2_BUCKET: ${{ secrets.HOWDAH_R2_BUCKET }}
          HOWDAH_R2_DRY_RUN: ${{ inputs.publish && '0' || '1' }}
          HOWDAH_R2_OVERWRITE: ${{ inputs.overwrite && '1' || '0' }}
        run: |
          if [ "$HOWDAH_R2_DRY_RUN" = 1 ]; then
            echo "::notice::publish=false: DRY RUN, nothing is written to R2"
          fi
          if [ -z "$HOWDAH_R2_BUCKET" ]; then
            echo "::error::secret HOWDAH_R2_BUCKET is not set (see packaging/repo/GO-LIVE.md)"
            exit 1
          fi
          packaging/repo/publish-r2.sh "$HOWDAH_R2_BUCKET"

      # ---- layout repositories (cPanel, Plesk, CloudLinux, stock EL) --------
      # Everything below runs AFTER the main repo upload above and writes only
      # under its own prefixes (cpanel/, plesk/, cloudlinux/, el/php<minor>/),
      # each a separate signed apt and/or yum repo; nothing under apt/ or yum/.
      # A failure here cannot change what the main repo published.
      - name: Collect layout packages
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: packaging/out/layouts
          pattern: layouts-*
          merge-multiple: true

      - name: Any layout packages?
        id: layouts
        run: |
          list="$(sh packaging/repo/layout-prefixes.sh packaging/out/layouts)"
          printf '%s\n' "$list"
          if [ -n "$list" ]; then echo "has=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::no layout packages were built; skipping the layout repos"; echo "has=false" >> "$GITHUB_OUTPUT"; fi

      - name: Seed the layout repos from R2 (keep prior versions in each index)
        if: steps.layouts.outputs.has == 'true'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.HOWDAH_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.HOWDAH_R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.HOWDAH_R2_ENDPOINT }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          HOWDAH_R2_BUCKET: ${{ secrets.HOWDAH_R2_BUCKET }}
        run: packaging/repo/seed-layouts-r2.sh "$HOWDAH_R2_BUCKET"

      - name: Assemble + sign the layout repos (same apt/yum builders, seeded)
        if: steps.layouts.outputs.has == 'true'
        env:
          HOWDAH_GPG_KEYID: "9A104FB0A073065B2C2631FC1E8D725D31BD5DC9!"
          HOWDAH_GNUPGHOME: ${{ github.workspace }}/.gnupg-home
          HOWDAH_LAYOUT_SEED: ${{ github.workspace }}/packaging/out/layout-seed
        run: packaging/repo/build-layout-repos.sh

      - name: Verify the layout repo signatures against the COMMITTED public key
        if: steps.layouts.outputs.has == 'true'
        run: |
          tmp="$(mktemp -d)"
          export GNUPGHOME="$tmp"
          gpg --batch --import packaging/howdah-release-signing.asc
          r=packaging/out/layout-repo
          for f in $(find "$r" -path '*/apt/dists/stable/InRelease' | sort); do gpg --batch --verify "$f"; done
          for f in $(find "$r" -path '*/apt/dists/stable/Release' | sort); do gpg --batch --verify "$f.gpg" "$f"; done
          for f in $(find "$r" -path '*/yum/repodata/repomd.xml' | sort); do gpg --batch --verify "$f.asc" "$f"; done
          find "$r" -type f \( -name '*.rpm' -o -name '*.deb' \) | sort
          rm -rf "$tmp"

      - name: List the new layout packages (attestation subjects)
        if: ${{ inputs.publish && steps.layouts.outputs.has == 'true' }}
        run: |
          set -euo pipefail
          sh packaging/repo/layout-prefixes.sh packaging/out/layouts | while read -r prefix kind; do
            packaging/repo/attest-subjects.sh "packaging/out/layouts/$prefix/$kind" \
              "packaging/out/layout-repo/$prefix" "$prefix/"
          done > packaging/out/attest-layouts.sha256
          cat packaging/out/attest-layouts.sha256

      - name: Attest build provenance (layout packages)
        if: ${{ inputs.publish && steps.layouts.outputs.has == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: packaging/out/attest-layouts.sha256

      - name: Upload the layout repos to R2 (dependency order, own prefixes only)
        if: steps.layouts.outputs.has == 'true'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.HOWDAH_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.HOWDAH_R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.HOWDAH_R2_ENDPOINT }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          HOWDAH_R2_BUCKET: ${{ secrets.HOWDAH_R2_BUCKET }}
          HOWDAH_R2_DRY_RUN: ${{ inputs.publish && '0' || '1' }}
          HOWDAH_R2_OVERWRITE: ${{ inputs.overwrite && '1' || '0' }}
        run: packaging/repo/publish-layouts-r2.sh "$HOWDAH_R2_BUCKET"

      - name: Summary
        run: |
          {
            echo "### publish-repos"
            echo "- published to R2: \`${{ inputs.publish }}\` (false = dry run)"
            echo "- layout repos (cpanel/, plesk/, cloudlinux/, el/php<minor>/): \`${{ steps.layouts.outputs.has }}\`"
            echo "- next: verify against https://pkg.howdah.org (GO-LIVE.md step 4)"
            echo "- Cloudflare: long cache for \`pool/\`+\`*.rpm\`, short/bypass for \`dists/\`+\`repodata/\`"
          } >> "$GITHUB_STEP_SUMMARY"
