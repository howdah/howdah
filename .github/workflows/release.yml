name: release

# Tag-triggered. Pushing a version tag (e.g. v0.1.0) builds the glibc-2.17
# howdah.so for every supported PHP minor, signs the set with the CI signing
# subkey, and publishes a GitHub Release with the tarballs + SHA256SUMS +
# detached signature + the public signing key. Pre-release tags (v1.2.3-rc1)
# are published as DRAFT pre-releases, never full public releases.
# Every asset also gets a SLSA build provenance attestation and the tarballs a
# CycloneDX SBOM attestation (release job, after the GPG signing, which is
# unchanged). The tarballs are reproducible: docs/verify.md.
on:
  push:
    tags:
      - "v*"

# Least privilege by default: only the release job may write releases.
permissions:
  contents: read

jobs:
  # ---- fail fast if the tag and the crate version disagree -----------------
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the Cargo package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"   # strip any pre-release suffix (-rc1, -beta, ...)
          cargo_ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$GITHUB_REF_NAME base=$base cargo=$cargo_ver"
          if [ "$base" != "$cargo_ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($base) does not match Cargo version $cargo_ver"
            exit 1
          fi

  # ---- one glibc-2.17 tarball per PHP minor --------------------------------
  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full supported matrix. build-release.sh builds <= 8.1 from Remi EL7
        # headers and 8.2-8.5 from pinned+verified PHP source, both on a
        # glibc-2.17 (CentOS 7) base, and asserts via objdump that no glibc
        # symbol newer than 2.17 is referenced (the build fails otherwise).
        minor: ["5.4", "5.5", "5.6", "7.0", "7.1", "7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Build glibc-2.17 tarball for PHP ${{ matrix.minor }}
        run: |
          # Name assets from the tag (keeps any -rc suffix), not Cargo.toml.
          HOWDAH_VERSION="${GITHUB_REF_NAME#v}"
          export HOWDAH_VERSION
          HOWDAH_ARCH=x86_64 packaging/build-release.sh "${{ matrix.minor }}"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: howdah-php${{ matrix.minor }}-x86_64
          path: packaging/out/*.tar.gz
          if-no-files-found: error

  # ---- aarch64 tarballs: BEST-EFFORT, never blocks the release -------------
  # Chosen path: GitHub's native arm64 Linux runner (ubuntu-24.04-arm, free for
  # public repos); the QEMU-on-ubuntu-latest fallback is NOT used. Every minor
  # builds PHP headers from source (Remi has no aarch64 EL7). PHP 5.x may fail
  # (old ./configure may not detect aarch64); a failed cell just means no
  # aarch64 tarball for that minor and the release job still publishes.
  build-aarch64:
    needs: check
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    # Bound a started-but-stuck arm64 cell so it cannot hold `release` for the
    # 360-min default. (A cell that never gets a runner is a separate case: it
    # delays `release` until GitHub's unassigned-job timeout, then fails and the
    # release publishes x86_64-only. arm64 runner availability is surfaced by
    # the ci.yml aarch64 smoke on every PR.)
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        minor: ["5.4", "5.5", "5.6", "7.0", "7.1", "7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Build glibc-2.17 aarch64 tarball for PHP ${{ matrix.minor }}
        run: |
          HOWDAH_VERSION="${GITHUB_REF_NAME#v}"
          export HOWDAH_VERSION
          HOWDAH_ARCH=aarch64 packaging/build-release.sh "${{ matrix.minor }}"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: howdah-php${{ matrix.minor }}-aarch64
          path: packaging/out/*.tar.gz
          if-no-files-found: error

  # ---- musl (Alpine) x86_64 tarballs: BEST-EFFORT, never blocks the release --
  # Same source, built on Alpine 3.21 (packaging/release.musl.Dockerfile) with
  # from-source PHP headers; named ...-linux-x86_64-musl.tar.gz. docker.yml
  # builds the -alpine images from these. A failed cell means no musl tarball
  # (and no -alpine image) for that minor.
  build-musl:
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        minor: ["5.4", "5.5", "5.6", "7.0", "7.1", "7.2", "7.3", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Build musl tarball for PHP ${{ matrix.minor }}
        run: |
          HOWDAH_VERSION="${GITHUB_REF_NAME#v}"
          export HOWDAH_VERSION
          HOWDAH_ARCH=x86_64 HOWDAH_LIBC=musl packaging/build-release.sh "${{ matrix.minor }}"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: howdah-php${{ matrix.minor }}-x86_64-musl
          path: packaging/out/*.tar.gz
          if-no-files-found: error

  # ---- CycloneDX SBOM of howdah.so, one per target --------------------------
  # Its own read-only job, so the SBOM tool never runs where the signing key
  # and the OIDC token are. The release job attests the result.
  sbom:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate the SBOMs (pinned cargo-cyclonedx, Cargo.lock at this tag)
        run: |
          packaging/sbom.sh sbom/howdah-sbom-x86_64.cdx.json x86_64-unknown-linux-gnu
          packaging/sbom.sh sbom/howdah-sbom-aarch64.cdx.json aarch64-unknown-linux-gnu
          packaging/sbom.sh sbom/howdah-sbom-x86_64-musl.cdx.json x86_64-unknown-linux-musl

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: howdah-sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  # ---- hash, sign, and publish the whole set -------------------------------
  # Publishes whenever the gating x86_64 build is green, even if some (or all)
  # best-effort aarch64 or musl cells failed; whatever tarballs uploaded ship.
  # The SBOM job must be green too: no release ships without its attestations.
  release:
    needs: [build, build-aarch64, build-musl, sbom]
    if: ${{ always() && needs.build.result == 'success' && needs.sbom.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write       # only this job creates the release + uploads assets
      id-token: write       # OIDC token for the attestations' Sigstore certificate
      attestations: write   # store the provenance and SBOM attestations
    steps:
      - uses: actions/checkout@v4

      - name: Collect all tarballs
        uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true

      - name: Gather tarballs + standalone howdah-check into packaging/out
        run: |
          mkdir -p packaging/out
          find dl -name '*.tar.gz' -exec cp {} packaging/out/ \;
          # Publish howdah-check as a standalone top-level asset too (needed
          # BEFORE picking a tarball). The build matrix only uploads tarballs,
          # so take it straight from the checked-out repo. sign.sh then includes
          # it in SHA256SUMS, so it is covered by the detached signature.
          cp tools/howdah-check packaging/out/howdah-check
          chmod +x packaging/out/howdah-check
          ls -l packaging/out

      - name: Import CI signing subkey (passphraseless, non-interactive)
        env:
          HOWDAH_GPG_SIGNING_KEY: ${{ secrets.HOWDAH_GPG_SIGNING_KEY }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          printf '%s\n' "$HOWDAH_GPG_SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Sign (SHA256SUMS + detached signature)
        env:
          HOWDAH_SIGN_BATCH: "1"          # loopback pinentry
          HOWDAH_SIGN_PASSPHRASE: ""      # the CI subkey is passphraseless
        run: packaging/sign.sh packaging/out

      - name: Verify signature against the COMMITTED public key (clean keyring)
        run: |
          # Catch a key mismatch: verify with ONLY the public key users get
          # (packaging/howdah-release-signing.asc), in a throwaway GNUPGHOME,
          # not the signing key we just imported above.
          tmp="$(mktemp -d)"
          GNUPGHOME="$tmp" gpg --batch --import packaging/howdah-release-signing.asc
          GNUPGHOME="$tmp" gpg --batch --verify packaging/out/SHA256SUMS.asc packaging/out/SHA256SUMS
          ( cd packaging/out && sha256sum -c SHA256SUMS )
          rm -rf "$tmp"

      - name: Ship the public key alongside the signature
        run: cp packaging/howdah-release-signing.asc packaging/out/

      # ---- attestations: in addition to the GPG signature, not instead ------
      # A SLSA v1 build provenance statement per asset, signed through
      # Sigstore with this workflow run's OIDC identity (public-good instance,
      # recorded in its transparency log) and stored on the repository. It
      # names the repo, workflow, tag and commit that built the file. Verify:
      #   gh attestation verify <file> -R howdah/howdah     (docs/verify.md)
      - name: Attest build provenance (tarballs, howdah-check, SHA256SUMS)
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packaging/out/*.tar.gz
            packaging/out/howdah-check
            packaging/out/SHA256SUMS

      # The SBOM (sbom job, merged into dl/ above) bound to the tarballs of its
      # arch. actions/attest with sbom-path is the successor of attest-sbom.
      - name: Attest the SBOM (x86_64 tarballs)
        id: sbom-x86_64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packaging/out/*-linux-x86_64.tar.gz
          sbom-path: dl/howdah-sbom-x86_64.cdx.json

      - name: Attest the SBOM (aarch64 tarballs, if any were built)
        id: sbom-aarch64
        if: ${{ hashFiles('packaging/out/*-linux-aarch64.tar.gz') != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packaging/out/*-linux-aarch64.tar.gz
          sbom-path: dl/howdah-sbom-aarch64.cdx.json

      - name: Attest the SBOM (x86_64 musl tarballs, if any were built)
        id: sbom-musl
        if: ${{ hashFiles('packaging/out/*-linux-x86_64-musl.tar.gz') != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packaging/out/*-linux-x86_64-musl.tar.gz
          sbom-path: dl/howdah-sbom-x86_64-musl.cdx.json

      # The Sigstore bundles go out with the release, so anyone can verify
      # offline (cosign, or gh --bundle) without the GitHub API or an account.
      # They are self-authenticating, so SHA256SUMS does not need to cover them.
      - name: Stage the attestation bundles as release assets
        env:
          PROV: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_X86: ${{ steps.sbom-x86_64.outputs.bundle-path }}
          SBOM_ARM: ${{ steps.sbom-aarch64.outputs.bundle-path }}
          SBOM_MUSL: ${{ steps.sbom-musl.outputs.bundle-path }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cp "$PROV" "packaging/out/howdah-$v.provenance.sigstore.json"
          cp "$SBOM_X86" "packaging/out/howdah-$v-x86_64.sbom.sigstore.json"
          if [ -n "$SBOM_ARM" ]; then cp "$SBOM_ARM" "packaging/out/howdah-$v-aarch64.sbom.sigstore.json"; fi
          if [ -n "$SBOM_MUSL" ]; then cp "$SBOM_MUSL" "packaging/out/howdah-$v-x86_64-musl.sbom.sigstore.json"; fi
          ls -l packaging/out/*.sigstore.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release tag (v1.2.3-rc1) publishes a DRAFT pre-release, never a
          # full public release.
          extra=""
          case "$GITHUB_REF_NAME" in
            *-*) extra="--draft --prerelease"; echo "pre-release tag -> draft pre-release" ;;
          esac
          # $extra is deliberately unquoted: it is zero or two flags.
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Howdah ${GITHUB_REF_NAME}" \
            --notes "Signed release. Verify: \`gpg --import howdah-release-signing.asc && gpg --verify SHA256SUMS.asc SHA256SUMS && sha256sum -c SHA256SUMS\`. Build provenance: \`gh attestation verify <file> -R howdah/howdah\`. Reproducible: packaging/verify-reproducible.sh ${GITHUB_REF_NAME} <minor>. Details: docs/verify.md" \
            $extra \
            packaging/out/*.tar.gz \
            packaging/out/howdah-check \
            packaging/out/SHA256SUMS \
            packaging/out/SHA256SUMS.asc \
            packaging/out/howdah-release-signing.asc \
            packaging/out/*.sigstore.json
