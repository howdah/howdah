      - heading "Your commands" [level=2] [ref=f1e88]
      - paragraph [ref=f1e89]: These commands update as you change the choices above. One build per PHP minor version.
      - generic "Your commands" [ref=f1e90]:
        - list [ref=f1e91]:
          - listitem [ref=f1e92]:
            - heading "Add the signed apt repository" [level=3] [ref=f1e93]
            - paragraph [ref=f1e94]: The key is pinned to this repository only.
            - code [ref=f1e96]: sudo install -d -m 0755 /etc/apt/keyrings curl -fsSL https://howdah.org/key.asc | sudo tee /etc/apt/keyrings/howdah.asc >/dev/null echo "deb [signed-by=/etc/apt/keyrings/howdah.asc] https://pkg.howdah.org/apt stable main" | sudo tee /etc/apt/sources.list.d/howdah.list
          - listitem [ref=f1e97]:
            - heading "Install the package for your PHP" [level=3] [ref=f1e98]
            - paragraph [ref=f1e99]: Installs only against a matching PHP ABI, and enables the module for PHP 8.1.
            - code [ref=f1e101]: sudo apt-get update sudo apt-get install php8.1-howdah
          - listitem [ref=f1e102]:
            - heading "Verify it is loaded, then reload your server" [level=3] [ref=f1e103]
            - code [ref=f1e105]: "php -m | grep -i howdah php --ri howdah # Howdah => enabled, Mode => detect sudo systemctl reload php8.1-fpm"
          - listitem [ref=f1e106]:
            - heading "Roll back at any time" [level=3] [ref=f1e107]
            - code [ref=f1e109]: "sudo phpdismod -v 8.1 howdah # stop loading, keep the package sudo apt-get purge php8.1-howdah # or remove everything sudo systemctl reload php8.1-fpm"
