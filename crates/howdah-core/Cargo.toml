[package]
name = "howdah-core"
description = "Pure-Rust core of Howdah, a defensive WAF for PHP (no PHP types)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"

[lib]
crate-type = ["staticlib", "rlib"]
