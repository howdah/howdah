[package]
name = "howdah-wasm"
description = "WebAssembly build of the Howdah core for the in-browser demo (plain C-ABI exports, no wasm-bindgen)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
howdah-core = { path = "../howdah-core" }
serde_json = "1"
