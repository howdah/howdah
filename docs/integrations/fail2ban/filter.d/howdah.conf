# Fail2Ban filter for Howdah's event log (docs/log-schema.md, schema 2).
# Install as /etc/fail2ban/filter.d/howdah.conf, with jail.d/howdah.conf.
#
# A line matches only when Howdah refused the request or denied the call
# ("action":"block") and client_ip holds an address. These never match:
#   "action":"log"       detect mode, and Layer 4 observe's "proposed: " lines
#   "action":"excepted"  a finding an [[exceptions]] entry turned off
#   "client_ip":""       no client address (the command line, php -S)
#
# Keys are matched in any order, as the schema asks. A request cannot forge a
# match through its own values: Howdah writes a quote inside a value as \",
# so the text "action":"block" can only come from the key itself.
#
# The same filter reads the syslog form (howdah[pid]: {...}) in a syslog file.
# Checked with fail2ban 1.1.0 by lab/integration/log_consumers.sh.

[Definition]

failregex = ^(?=.*"action":"block").*"client_ip":"<ADDR>"

ignoreregex =

# ts is UTC Unix epoch milliseconds as a quoted string: "ts":"1792864974141"
datepattern = "ts":"{LEPOCH}"
