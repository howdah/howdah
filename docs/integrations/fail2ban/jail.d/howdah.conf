# Fail2Ban jail for Howdah. Install as /etc/fail2ban/jail.d/howdah.conf, with
# filter.d/howdah.conf. Bans an address after 3 requests Howdah refused within
# 10 minutes, for an hour, using your default banaction.
#
# Behind a reverse proxy, load balancer or CDN, client_ip is the proxy's
# address unless the web server restores the client address first (nginx
# realip, Apache mod_remoteip; see docs/integrations/README.md). Put every
# proxy address in ignoreip so a proxy is never banned. This line replaces a
# [DEFAULT] ignoreip, so repeat those addresses here.
#
# Howdah writes this log from the PHP worker, so code running as that user can
# add lines to it. Keep addresses you must never lose (your office, your
# monitoring) in ignoreip too.
#
# Howdah's log must be readable by fail2ban (it runs as root by default), and
# logpath must match howdah.log or [log] path.

[howdah]
enabled  = true
filter   = howdah
logpath  = /var/log/howdah/events.log
port     = http,https
maxretry = 3
findtime = 10m
bantime  = 1h
ignoreip = 127.0.0.1/8 ::1
