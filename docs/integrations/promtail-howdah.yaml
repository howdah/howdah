# Promtail: ship Howdah's event file to Loki.
# Tested with grafana/promtail:3.5.1 (lab/integration/siem_snippets.sh).
# Labels are the low-cardinality fields only: rule (24 values), action and
# layer. Keep client_ip and request_id out of labels; query them with
# `| json` in LogQL instead.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /var/lib/promtail/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: howdah
    static_configs:
      - targets: [localhost]
        labels:
          job: howdah
          __path__: /var/log/howdah/events.log
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            rule: rule
            action: action
            layer: layer
      - labels:
          rule:
          action:
          layer:
      # ts is UTC epoch milliseconds, as a string.
      - timestamp:
          source: ts
          format: UnixMs
