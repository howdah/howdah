# nginx front end for lab/bench/corpus.sh: every path goes to the corpus app
# (GoTestWAF puts payloads in the URL path too), except /probe.php, which
# server.sh uses to check the Howdah config before the run.
daemon off;
worker_processes 1;
pid /tmp/nginx-corpus.pid;
error_log /dev/stderr crit;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_buffer_size 256k;
    client_max_body_size 16m;

    server {
        listen 127.0.0.1:8080;

        location = /probe.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/probe.php;
            fastcgi_pass 127.0.0.1:9000;
        }

        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/corpus/app.php;
            fastcgi_param SCRIPT_NAME /app.php;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
