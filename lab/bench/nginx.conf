# nginx front end for the php-fpm cells of lab/bench/run.sh. Runs from the
# tools image inside the PHP container's network namespace; *.php goes to
# php-fpm on 127.0.0.1:9000 and the script path is the PHP container's
# /var/www/html (nginx never reads the file itself).
daemon off;
# One worker: with two, wrk's four connections split 4/0, 3/1 or 2/2 between
# them at random per run, which made p50 bimodal (about 95 vs 150 us) and
# swamped the difference being measured.
worker_processes 1;
pid /tmp/nginx-bench.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    # Keep the 50 KB multipart body in memory rather than a temp file.
    client_body_buffer_size 128k;
    client_max_body_size 16m;
    keepalive_requests 1000000;
    keepalive_timeout 60s;

    server {
        listen 127.0.0.1:8080;
        root /var/www/html;

        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
