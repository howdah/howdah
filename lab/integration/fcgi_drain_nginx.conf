# nginx front for the fcgi_drain lab (lab/integration/fcgi_drain.sh). Shares the
# php-fpm container's network namespace. The point is a REUSED FastCGI connection:
# fastcgi_keep_conn + an upstream keepalive pool, and no retry on a fresh connection
# (a retry would mask a desynchronised one).
worker_processes 1;
error_log /out/nginx.err warn;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 64m;
    upstream fpm { server 127.0.0.1:9000; keepalive 4; }
    server {
        listen 127.0.0.1:8080;
        root /work/app;
        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /work/app$uri;
            fastcgi_keep_conn on;
            fastcgi_next_upstream off;
            fastcgi_pass fpm;
        }
    }
}
