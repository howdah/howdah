# nginx front for the log-consumer lab (lab/integration/log_consumers.sh).
# Runs in a sidecar container sharing the php-fpm container's network
# namespace, so 127.0.0.1:9000 is that container's php-fpm. Two servers, same
# app:
#   8080: no real-IP config. REMOTE_ADDR (Howdah's client_ip) is whatever
#         connected to nginx, here the "load balancer" at 127.0.0.1.
#   8081: the realip module trusts X-Forwarded-For from 127.0.0.1 only, so
#         REMOTE_ADDR is the client address that hop reports. A request from
#         any other address keeps its own address, whatever header it sends.
worker_processes 1;
error_log /out/nginx.err warn;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    server {
        listen 127.0.0.1:8080;
        root /work/app;
        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /work/app$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
        }
        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /work/app/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
    server {
        listen 127.0.0.1:8081;
        root /work/app;
        # The snippet docs/integrations/README.md recommends.
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /work/app$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
        }
        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /work/app/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
