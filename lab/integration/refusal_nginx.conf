# nginx front for the refusal-path lab (lab/integration/refusal.sh). Runs in a
# sidecar container that shares the php-fpm container's network namespace, so
# 127.0.0.1:9000 is that container's php-fpm. Only SCRIPT_FILENAME points into
# the php-fpm container's filesystem; nginx never reads the scripts.
worker_processes 1;
error_log /out/nginx.err warn;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 64m;
    server {
        listen 127.0.0.1:8080;
        root /work/app;
        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /work/app$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
        }
        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /work/app/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
