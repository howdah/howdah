# nginx front for the FPM status-page injection lab (status_injection.sh). Runs
# in a sidecar sharing the php-fpm container's network namespace. Besides the
# app (/work/app/index.php) it routes /status to php-fpm's pm.status_path.
worker_processes 1;
error_log /out/nginx.err warn;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    server {
        listen 127.0.0.1:8080;
        root /work/app;
        location = /status {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /status;
            fastcgi_param SCRIPT_NAME /status;
            fastcgi_pass 127.0.0.1:9000;
        }
        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /work/app/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
