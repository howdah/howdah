; Howdah - defensive WAF for PHP (0.1 "PHP2Shell shield")
;
; Install: copy howdah.so into this PHP's extension_dir (run
;   `howdah-check detect` to find it) and drop this file into the SAPI's
; config directory (e.g. /etc/php.d/, conf.d/, or php.d/). One howdah.so is
; built per PHP minor and matches that minor's Zend module API number.
;
; The .so is a plain PHP extension, not a Zend extension:
extension=howdah.so

; --- Howdah settings --------------------------------------------------------

; howdah.mode: block | detect | off
;   detect  log what WOULD be blocked but let the request through -- the shipped
;           default (design §8): you confirm Howdah sees no legitimate traffic
;           before you opt into blocking. NOTE: critical limits still block
;           immediately even in detect mode (the critical-always-block rule), so
;           the worst memory-exhaustion abuse is refused out of the box; only the
;           standard rules merely log until you switch to block.
;   block   refuse abusive multipart/form-data before PHP allocates per-part
;           memory -- flip to this once you have watched the detect logs.
;   off     load but do nothing.
howdah.mode = detect

; howdah.config: absolute path to an optional TOML file that overrides the
;   built-in limits (max parts, max files, ...). Empty = built-in defaults.
howdah.config =
;   Layer-2 input inspection (SQLi / traversal / command injection) is also
;   configured in that TOML file, under [inspect]. It is LOG-ONLY by default and
;   does not block anything, even when howdah.mode = block. See docs/config.md.
;
;   Layer-3 sink hardening is configured in the same TOML file, under [sinks].
;   *** LOG-FIRST: [sinks] DOES NOT BLOCK by default. *** sinks.mode defaults to
;   "detect" (log only) and is independent of howdah.mode: a global
;   howdah.mode = block does NOT arm any sink. Block only by setting a sink's
;   mode = "block" -- and set its allowlist FIRST.
;   Active in 1.2: command_exec (system/exec/shell_exec/passthru/popen/proc_open)
;   and unserialize. unserialize is OFF by default (opt in with
;   [sinks.unserialize] mode = "detect"). include and eval are RESERVED -- not
;   active in 1.2; their keys do nothing yet. The sink argument is never logged.
;   Example (put it in the TOML file, not here):
;     [sinks]
;     mode = "detect"
;     [sinks.command_exec]
;     allow = ["id", "/usr/bin/convert *"]
;     [sinks.unserialize]
;     mode = "detect"
;     allow_classes = []

; howdah.log: absolute path to a JSON-lines event log. Empty = log to the
;   SAPI error log only. The directory must be writable by the PHP worker.
;   e.g. howdah.log = /var/log/howdah/events.log
howdah.log =
