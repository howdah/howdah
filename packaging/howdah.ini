; Howdah - defensive WAF for PHP (0.1 "PHP2Shell shield")
;
; Install: copy howdah.so into this PHP's extension_dir (run
;   `howdah-check detect` to find it) and drop this file into the SAPI's
; config directory (e.g. /etc/php.d/, conf.d/, or php.d/). One howdah.so is
; built per PHP minor and matches that minor's Zend module API number.
;
; The .so is a plain PHP extension, not a Zend extension:
extension=howdah.so

; --- Howdah settings --------------------------------------------------------

; howdah.mode: block | detect | off
;   detect  log what WOULD be blocked but let the request through -- the shipped
;           default (design §8): you confirm Howdah sees no legitimate traffic
;           before you opt into blocking. NOTE: critical limits still block
;           immediately even in detect mode (the critical-always-block rule), so
;           the worst memory-exhaustion abuse is refused out of the box; only the
;           standard rules merely log until you switch to block.
;   block   refuse abusive multipart/form-data before PHP allocates per-part
;           memory -- flip to this once you have watched the detect logs.
;   off     load but do nothing.
howdah.mode = detect

; howdah.config: absolute path to an optional TOML file that overrides the
;   built-in limits (max parts, max files, ...). Empty = built-in defaults.
howdah.config =
;   Layer-2 input inspection (SQLi / traversal / command injection) is also
;   configured in that TOML file, under [inspect]. Those three classes are
;   LOG-ONLY by default and do not block anything, even when howdah.mode = block.
;   The one exception is cgi_arg_injection (php-cgi argument injection,
;   CVE-2012-1823 / CVE-2024-4577), which refuses the request by default under
;   every mode but off; [inspect] cgi_arg = "detect" or "off" changes that. See
;   docs/config.md.
;
;   Layer-3 sink hardening is configured in the same TOML file, under [sinks].
;   *** LOG-FIRST: [sinks] DOES NOT BLOCK by default. *** sinks.mode defaults to
;   "detect" (log only) and is independent of howdah.mode: a global
;   howdah.mode = block does NOT arm any sink. Block only by setting a sink's
;   mode = "block" -- and set its allowlist FIRST.
;   The one exception is xxe (XML external entities): it is ENFORCED by default,
;   under every mode but off, but only when a dangerous libxml flag (LIBXML_NOENT,
;   DTDLOAD, DTDATTR, DTDVALID) is passed together with an XML string that
;   declares an external entity or an entity bomb (simplexml_load_string, new
;   SimpleXMLElement, DOMDocument::loadXML, XMLReader::XML). It removes the
;   dangerous flags and lets the parse continue; a bare DOCTYPE or an external
;   DTD (SAML, SVG, XHTML, Office XML) is never blocked. [sinks.xml] mode =
;   "detect" or "off" changes that. See docs/config.md.
;   ALSO ENFORCED by default (new in 1.7): the include/open wrapper-scheme
;   firewall. include/require of a non-file stream wrapper (php://filter chains,
;   php://input, data:, expect://, remote http(s)/ftp(s)) and fopen/
;   file_get_contents/readfile of a dangerous wrapper (php://filter, data:,
;   expect://) are refused, as are include/open of a poisonable local target
;   (/proc/self/environ and other /proc/*, the session dir, error_log). This is
;   on under every mode but off, independent of sinks.mode. [sinks.include]
;   wrapper = "detect"/"off" and poison = "detect"/"off" change it. Only a
;   scheme/category label is logged, never the target. See docs/config.md.
;   Active: command_exec (system/exec/shell_exec/passthru/popen/proc_open),
;   unserialize, include/require and eval on all PHP versions (5.4-8.5; include
;   and eval on 5.x are new in 1.3, and on 5.x an include served from a warm
;   opcache is not re-inspected). unserialize is OFF by default (opt in with
;   [sinks.unserialize] mode = "detect"); include is inert until
;   [sinks.include] allow_paths is set. New in 1.3: phar:// and SSRF guards,
;   both OFF by default and armed ONLY by an explicit per-sink mode (neither
;   [sinks] mode nor howdah.mode arms them). The sink argument is never logged.
;   Example (put it in the TOML file, not here):
;     [sinks]
;     mode = "detect"
;     [sinks.command_exec]
;     allow = ["id", "/usr/bin/convert *"]
;     [sinks.unserialize]
;     mode = "detect"
;     allow_classes = []
;     [sinks.phar]      # off by default; 5.x/7.x deserialization, 8.x detect/deny only
;     mode = "detect"
;     allow_paths = ["/var/www/vendor"]
;     [sinks.ssrf]      # off by default; one DNS lookup per outbound host, no timeout
;     mode = "detect"
;     allow_hosts = ["10.1.2.3", "192.168.50.0/24", "internal-api.svc"]
;
;   Layer-4 after-breach behaviour is configured under [behavior] and is
;   independent of howdah.mode too. Its facets (deny_exec_dirs, allow_exec_binaries,
;   allow_egress_hosts, deny_php_writes) are log-only and inert until their lists
;   are set. Two FILE GUARDS are ENFORCED by default (new in 1.7), each with its
;   own mode that does not follow [behavior] mode:
;     delete_guard = "block"  unlink / rmdir / rename-away of wp-config.php, .env,
;                             .env.*, private-key files, or a '..' traversal that
;                             lands in a system directory (rule file_delete).
;                             Deleting wp-config.php resets WordPress to its
;                             installer. Cache, temp, session and upload deletes
;                             are never touched.
;     upload_write = "block"  move_uploaded_file into a .php/.phtml/.pht/.php3-8/
;                             .phar or a .htaccess/.user.ini/web.config name (rule
;                             php_write): the durable upload bypass. Other write
;                             sinks (file_put_contents, fopen, copy, rename) are
;                             covered by deny_php_writes under deny_exec_dirs.
;   secret_read is OPT-IN (off by default): [behavior] secret_read = "detect" logs
;   reads of .env, wp-config.php, key files and /etc/passwd-class files (rule
;   secret_read) without blocking; "block" refuses them. Apps read their own
;   config, so observe before you block. delete_guard / upload_write = "detect"
;   or "off" change the enforced ones. Only a path CATEGORY and the calling
;   script file:line are logged, never the target. See docs/config.md.

; howdah.log: absolute path to a JSON-lines event log. The file (or its
;   directory) must be writable by the PHP worker. It wins over [log] path in
;   the TOML file; [log] destination = "syslog" or "stderr" ignores it.
;   Empty and no [log] in the TOML = events go to stderr: Apache's error log,
;   but under php-fpm only with catch_workers_output = yes (otherwise they are
;   lost). The TOML [log] table also offers syslog and a per-event exec hook;
;   see docs/config.md.
;   e.g. howdah.log = /var/log/howdah/events.log
howdah.log =
