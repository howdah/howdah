# Howdah application profile: Magento 2.4 (vanilla; modules add behaviours of
# their own). A STARTING POINT, never applied automatically.
#
# Verified against https://github.com/magento/magento2/blob/2.4-develop/<path>
# and the Adobe Commerce configuration guide. Paths below assume a composer
# install (lib/internal/Magento/Framework/... is vendor/magento/framework/...);
# a git-clone install keeps lib/internal, so adjust.
#
# Before use: replace /var/www/html with the path PHP reports for your docroot
# (`__FILE__` in a script; symlinks are resolved), read every entry, delete
# what you do not need, keep the reasons. See docs/exceptions.md.

mode = "detect"

# ---------------------------------------------------------------------------
# Layer 4 [behavior]
# ---------------------------------------------------------------------------
# Writable in production per the file-system-permissions guide: var and
# pub/media (vendor, app/code, app/etc, pub/static, generated/code,
# generated/metadata, var/view_preprocessed have write access removed). PHP
# never executes legitimately from pub/media or var; generated/code DOES hold
# executable PHP (factories, proxies, interceptors), so do not deny it.
# DirectoryList: lib/internal/Magento/Framework/App/Filesystem/
# DirectoryList.php L160-185.
[behavior]
mode = "detect"
# deny_exec_dirs = ["/var/www/html/pub/media", "/var/www/html/var", "/var/www/html/pub/static"]
# deny_php_writes = true
# Cron groups with use_separate_process=1 (index, consumers, analytics by
# default) are started as child processes: `php bin/magento cron:run
# --group=<g> --bootstrap=standaloneProcessStarted=1` (app/code/Magento/Cron/
# Observer/ProcessCronQueueObserver.php L268-290). The php binary comes from
# PhpExecutableFinder (L268). Name it before arming unexpected_binary.
# allow_exec_binaries = ["php", "/usr/bin/php"]
# Outbound from the admin: notifications.magentocommerce.com (app/code/
# Magento/AdminNotification/etc/config.xml L12); Advanced Reporting
# (advancedreporting.rjmetrics.com) runs under the analytics cron group.
# allow_egress_hosts = ["notifications.magentocommerce.com", "advancedreporting.rjmetrics.com"]

# ---------------------------------------------------------------------------
# Layer 3 [sinks]
# ---------------------------------------------------------------------------
# Every shell call goes through Magento\Framework\Shell\Driver::execute, which
# calls exec() (lib/internal/Magento/Framework/Shell/Driver.php L47). The
# cron child command is the one that runs in the web/cron process. Prefer the
# anchored allow pattern; adjust the php path to what PhpExecutableFinder
# returns on your host.
[sinks.command_exec]
allow = ["php /var/www/html/bin/magento cron:run *", "/usr/bin/php /var/www/html/bin/magento cron:run *"]

# unserialize: the Serialize library's PHP-format serializer calls
# unserialize($string, ['allowed_classes' => false]) (lib/internal/Magento/
# Framework/Serialize/Serializer/Serialize.php L45) and the default serializer
# is JSON. Objects are never deserialized, so the sink would only see arrays:
# [sinks.unserialize]
# mode = "detect"
# allow_classes = []

# ---------------------------------------------------------------------------
# [[exceptions]]
# ---------------------------------------------------------------------------
# The exec() lives in Shell/Driver.php, so that file is the executing script
# Howdah attributes the call to, whichever observer or command started it.
[[exceptions]]
rule   = "sinks.command_exec"
script = "/var/www/html/vendor/magento/framework/Shell/Driver.php"
reason = "Magento\\Framework\\Shell\\Driver::execute is the single exec() in the framework (Shell/Driver.php L47); cron groups with use_separate_process=1 spawn `php bin/magento cron:run --group=...` through it. This means command_exec is not checked for calls made through Shell\\Driver; prefer the allow patterns when the paths are fixed."

[[exceptions]]
rule   = "behavior.unexpected_binary"
script = "/var/www/html/vendor/magento/framework/Shell/Driver.php"
reason = "Same Shell\\Driver spawn, Layer 4 facet. Remove once php is in allow_exec_binaries."

# php_write: all framework file writes go through the filesystem driver
# (lib/internal/Magento/Framework/Filesystem/Driver/File.php: file_put_contents
# L633, fopen L661, rename L342). Code generation writes generated/code/**.php
# through it (Code/Generator/Io.php L98, triggered by the autoloader on any
# bootstrapped entry point: pub/index.php, bin/magento, cron; DefinitionFactory
# L53-57) and env.php/config.php are written through it too (App/
# DeploymentConfig/Writer.php L127-153). In production mode generated/ should
# be read-only, so this entry mostly matters in developer/default mode.
[[exceptions]]
rule   = "behavior.php_write"
script = "/var/www/html/vendor/magento/framework/Filesystem/Driver/File.php"
reason = "Magento writes every file, including generated/code/*.php (Code/Generator/Io.php L98) and app/etc/env.php, through Filesystem/Driver/File.php (L633 file_put_contents, L661 fopen, L342 rename). This means php_write is not checked for writes made through the driver."

# Layer 2: admin forms. The backend frontName defaults to `admin` but is
# usually randomised at install (admin_xxxxxx); adjust uri_prefix. CMS page
# `content`, product attributes under product[...], email `template_text`.
[[exceptions]]
rule       = "inspect"
param      = "content"
uri_prefix = "/admin/"
reason     = "CMS page/block content in the admin: HTML, widget directives, scripts. Adjust uri_prefix to the backend frontName."

[[exceptions]]
rule         = "inspect"
param_prefix = "product["
uri_prefix   = "/admin/"
reason       = "Product attribute form fields (description, short_description, layout XML) are posted as product[...]."

[[exceptions]]
rule       = "inspect"
param      = "template_text"
uri_prefix = "/admin/"
reason     = "Transactional email template body."

# setup/index.php (the web setup wizard, still shipped in 2.4-develop) and
# bin/magento setup:di:compile write generated/metadata/<area>.php through
# setup/src/Magento/Setup/Module/Di/Compiler/Config/Writer/Filesystem.php
# L47. CLI-only in practice; add if the wizard is used:
# [[exceptions]]
# rule   = "behavior.php_write"
# script = "/var/www/html/setup/src/Magento/Setup/Module/Di/Compiler/Config/Writer/Filesystem.php"
# reason = "setup:di:compile / web setup wizard write generated/metadata/*.php."
